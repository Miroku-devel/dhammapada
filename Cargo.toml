[package]
name = "dhammapada"
version = "0.3.1"
edition = "2024"

[profile.release]
strip = true
opt-level = "z"
lto = true

[dependencies]
gtk4 = "0.11.3"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
adw = { package = "libadwaita", version = "0.9.1" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
glib = "0.22.7"